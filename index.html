<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Budget Coach — Conversational AI Agent</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%232563eb'/%3E%3Cpath d='M7 12.5l3 3 7-7' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    background: #f4f6f8;
    color: #1f2329;
    line-height: 1.5;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 20px 14px 40px; }
  header { text-align: center; margin-bottom: 14px; }
  header h1 { font-size: 26px; font-weight: 700; letter-spacing: .5px; }
  header p { color: #6b7280; font-size: 13px; margin-top: 4px; }
  header .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
                background: #22c55e; margin-right: 6px; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

  /* ---- chat shell ---- */
  .chat-card {
    background: #fff; border-radius: 14px; box-shadow: 0 1px 3px rgba(16,24,40,.08);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .ctxbar {
    display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center;
    padding: 9px 14px; background: #f8fafc; border-bottom: 1px solid #eef0f3;
    font-size: 12.5px; color: #4b5563;
  }
  .ctxbar b { color: #1f2329; }
  .ctxbar .chip-ctx { background: #eef2ff; color: #4338ca; border-radius: 999px;
                      padding: 2px 9px; font-weight: 600; }
  .chat {
    height: 52vh; min-height: 300px; overflow-y: auto;
    padding: 16px 14px; background: #fafbfc;
    display: flex; flex-direction: column; gap: 12px;
  }
  @media (max-width: 640px) { .chat { height: 46vh; } }

  .msg { max-width: 92%; display: flex; flex-direction: column; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.agent { align-self: flex-start; align-items: flex-start; }
  .bubble {
    padding: 10px 14px; border-radius: 14px; font-size: 14.5px;
    word-wrap: break-word; white-space: normal;
  }
  .msg.user .bubble {
    background: #2563eb; color: #fff; border-bottom-right-radius: 4px;
    box-shadow: 0 1px 2px rgba(37,99,235,.25);
  }
  .msg.agent .bubble {
    background: #fff; color: #1f2329; border: 1px solid #e5e7eb;
    border-bottom-left-radius: 4px;
  }
  .msg.agent .bubble.card { width: 100%; }
  .who { font-size: 11px; color: #9ca3af; margin: 3px 6px 0; }

  /* ---- structured reply inside a bubble ---- */
  .bubble p { margin: 0 0 8px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble ol { margin: 6px 0 0 18px; }
  .bubble ol li { margin-bottom: 6px; }
  .bubble ol li:last-child { margin-bottom: 0; }
  .verdict { border-radius: 10px; padding: 12px 14px; color: #fff; margin: 4px 0 12px; }
  .verdict .v-label { font-size: 11px; opacity: .85; text-transform: uppercase; letter-spacing: .6px; }
  .verdict .v-text { font-size: 17px; font-weight: 700; margin-top: 2px; }
  .verdict.emergency { background: #b91c1c; }
  .verdict.aggressive { background: #b45309; }
  .verdict.optimize { background: #15803d; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 0 0 12px; }
  @media (max-width: 560px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  .stat { background: #f9fafb; border: 1px solid #eef0f3; border-radius: 8px; padding: 8px 10px; }
  .stat .s-label { font-size: 10.5px; color: #6b7280; text-transform: uppercase; letter-spacing: .4px; }
  .stat .s-val { font-size: 15px; font-weight: 700; margin-top: 1px; }
  .stat .s-val.red { color: #b91c1c; }
  .stat .s-val.green { color: #15803d; }
  .flag-item {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 7px 10px; border-radius: 8px; background: #fef2f2;
    border: 1px solid #fecaca; margin-bottom: 6px; font-size: 13px;
  }
  .flag-item .badge { background: #dc2626; color: #fff; font-size: 11px; font-weight: 600;
                      border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
  .no-flags { padding: 7px 10px; border-radius: 8px; background: #f0fdf4;
              border: 1px solid #bbf7d0; color: #15803d; font-size: 13px; }
  .section-title { font-size: 12px; font-weight: 600; color: #374151; margin: 12px 0 6px;
                   text-transform: uppercase; letter-spacing: .4px; }
  .budget-table { width: 100%; border-collapse: collapse; margin-top: 4px; font-size: 13.5px; }
  .budget-table td { border-bottom: 1px solid #f0f0f0; padding: 4px 6px; }
  .budget-table td:last-child { text-align: right; font-weight: 600; }
  .agent-foot { margin-top: 10px; font-size: 13px; color: #6b7280; font-style: italic; }

  /* ---- composer ---- */
  .composer { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid #eef0f3; background: #fff; }
  .composer input {
    flex: 1; padding: 10px 12px; font-size: 14.5px;
    border: 1px solid #d1d5db; border-radius: 10px; outline: none;
  }
  .composer input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
  .composer button {
    border: none; background: #2563eb; color: #fff; font-size: 14.5px; font-weight: 600;
    padding: 0 18px; border-radius: 10px; cursor: pointer;
  }
  .composer button:hover { background: #1d4ed8; }

  /* ---- example chips ---- */
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .chip {
    background: #fff; border: 1px solid #d1d5db; color: #374151;
    border-radius: 999px; padding: 6px 12px; font-size: 12.5px; cursor: pointer;
    transition: all .15s;
  }
  .chip:hover { border-color: #2563eb; color: #2563eb; background: #eef2ff; }
  .chips-label { font-size: 12px; color: #9ca3af; margin-top: 12px; }

  details.rules { margin-top: 16px; font-size: 13px; }
  details.rules summary { cursor: pointer; color: #6b7280; font-weight: 600; }
  .rules-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  .rules-table td { border-bottom: 1px solid #f0f0f0; padding: 5px 8px; color: #4b5563; }
  .rules-table td:last-child { text-align: right; font-weight: 600; }
  footer { text-align: center; color: #9ca3af; font-size: 12px; margin-top: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="dot"></span>Personal Budget Coach</h1>
    <p>Conversational AI agent — ask about your budget in plain English. Rule-based, no external APIs.</p>
  </header>

  <div class="chat-card">
    <div class="ctxbar" id="ctxbar"></div>
    <div class="chat" id="chat"></div>
    <div class="composer">
      <input type="text" id="msgInput" placeholder="Type a question, e.g. “I earn $5000 a month and spend $1500 on rent…”" autocomplete="off">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <div class="chips-label">Try asking…</div>
  <div class="chips" id="chips"></div>

  <details class="rules">
    <summary>Health thresholds used by this agent (rules)</summary>
    <table class="rules-table" id="rulesTbl"></table>
  </details>

  <footer>Conversational rule-based agent · logic mirrors personal_budget_coach.py · no data is stored</footer>
</div>

<script>
"use strict";
/* =====================================================================
   Personal Budget Coach — conversational agent
   Part 1: budget rules (same engine as personal_budget_coach.py)
   ===================================================================== */
const THRESHOLDS = {
  "Housing": 0.30, "Utilities": 0.10, "Food & Groceries": 0.15,
  "Transportation": 0.15, "Insurance": 0.10, "Debt Payments": 0.20,
  "Entertainment": 0.10, "Shopping": 0.10, "Health": 0.10,
  "Education": 0.10, "Other": 0.10
};
const SAVINGS_TARGET = 0.10;
const BRANCH_META = {
  emergency: { label: "EMERGENCY", text: "Spending exceeds income — act now" },
  aggressive: { label: "AGGRESSIVE CUTS", text: "Savings rate below 10% — trim to target" },
  optimize: { label: "OPTIMIZATION TIPS", text: "Savings rate at/above 10% — fine-tune" }
};

function money(n) { return "$" + Math.round(n).toLocaleString("en-US"); }
function pct(r) { return (r * 100).toFixed(1) + "%"; }

function analyze(income, expenses) {
  let total = 0;
  Object.values(expenses).forEach(function (v) { total += v; });
  const savings = income - total;
  const rate = savings / income;

  const flags = [];
  Object.keys(expenses).forEach(function (cat) {
    const amt = expenses[cat];
    const limit = (THRESHOLDS[cat] || 0.10) * income;
    if (amt > limit) {
      flags.push({ category: cat, amount: amt, threshold: limit, over_by: amt - limit });
    }
  });
  flags.sort(function (a, b) { return b.over_by - a.over_by; });

  const branch = rate < 0 ? "emergency" : (rate < SAVINGS_TARGET ? "aggressive" : "optimize");
  const advice = buildAdvice(income, total, savings, rate, flags, branch);
  return { income: income, total: total, savings: savings, rate: rate,
           branch: branch, flags: flags, advice: advice };
}

function buildAdvice(income, total, savings, rate, flags, branch) {
  const tips = [];
  if (branch === "emergency") {
    tips.push("You are spending " + money(Math.abs(savings)) + " MORE than you earn each month " +
      "(savings rate " + pct(rate) + "). Stop the bleed first.");
    flags.slice(0, 3).forEach(function (f) {
      tips.push("Cut " + f.category + " from " + money(f.amount) + " to the healthy " +
        money(f.threshold) + " — frees " + money(f.over_by) + "/month.");
    });
    tips.push("Temporarily zero out Entertainment / Shopping / dining out until your savings rate is back above 0%.");
    tips.push("If Housing exceeds 30% of income, consider negotiating rent, subletting, or moving within 3 months.");
  } else if (branch === "aggressive") {
    const need = income * SAVINGS_TARGET - savings;
    tips.push("Savings rate is " + pct(rate) + " — below the 10% health line. " +
      "You need to free up about " + money(need) + "/month to reach it.");
    let freed = 0;
    flags.forEach(function (f) {
      tips.push("Cut " + f.category + " from " + money(f.amount) + " to " + money(f.threshold) +
        " — frees " + money(f.over_by) + "/month.");
      freed += f.over_by;
    });
    if (freed >= need) {
      tips.push("Cutting the flagged categories to their healthy thresholds gets you to the 10% goal. Automate that transfer on payday.");
    } else {
      tips.push("Flagged cuts free " + money(freed) + "; you're still " + money(need - freed) +
        " short. Also trim dining out and subscriptions, or add a side-income stream of ~" + money(need - freed) + "/month.");
    }
  } else {
    if (rate >= 0.20) {
      tips.push("Outstanding — you're saving " + pct(rate) + " of income. That's well above the 10% health line.");
    } else {
      tips.push("Healthy — you're saving " + pct(rate) + " (≥ 10%). Small refinements can push you further.");
    }
    flags.forEach(function (f) {
      tips.push("One category to trim: " + f.category + " is " + money(f.over_by) + " above its threshold.");
    });
    tips.push("Automate a savings transfer on payday, and review bills / subscriptions once a year to renegotiate.");
    tips.push("If Housing is under 30% and debts are managed, consider investing your surplus rather than just saving it.");
  }
  return tips;
}

/* =====================================================================
   Part 2: natural-language understanding (rule-based, no APIs)
   ===================================================================== */
const CAT_RULES = [
  { cat: "Housing",         words: ["housing","rent","mortgage","apartment","home loan"] },
  { cat: "Utilities",       words: ["utilities","utility bill","electricity","electric","water bill","gas bill","internet","wifi","phone bill","cell phone"] },
  { cat: "Food & Groceries", words: ["food","groceries","grocery","dining","restaurant","eating out","meals","lunch","coffee shop"] },
  { cat: "Transportation",  words: ["transportation","transport","car loan","car payment","gas","fuel","transit","uber","commute","parking"] },
  { cat: "Insurance",       words: ["insurance"] },
  { cat: "Debt Payments",   words: ["debt","loan","loans","credit card","credit cards","student loan","borrowing","min payment"] },
  { cat: "Entertainment",   words: ["entertainment","movies","streaming","netflix","fun","hobbies","travel","vacation","concerts"] },
  { cat: "Shopping",        words: ["shopping","clothes","clothing","amazon","purchases"] },
  { cat: "Health",          words: ["health","medical","gym","doctor","medication","healthcare","fitness"] },
  { cat: "Education",       words: ["education","tuition","school","courses","textbooks"] },
  { cat: "Other",           words: ["other","misc","miscellaneous","everything else"] }
];
const INCOME_WORDS = ["income","salary","earn","earnings","makes","make","take home","take-home","paycheck","wages","wage","bring home"];

function escapeRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

/* tokenize all dollar amounts, remember position + value (commas stripped) */
function tokenizeAmounts(text) {
  const tokens = [];
  const re = /\$?\s*(\d[\d,]*(?:\.\d+)?)/g;
  let m;
  while ((m = re.exec(text)) !== null) {
    const after = text.slice(m.index + m[0].length, m.index + m[0].length + 2);
    if (/^%/.test(after)) continue; // a percentage, not a dollar amount
    const value = parseFloat(m[1].replace(/,/g, ""));
    if (!isFinite(value)) continue;
    tokens.push({ value: value, index: m.index, raw: m[0], used: false });
  }
  return tokens;
}
function nearestBefore(tokens, pos) {
  let best = null;
  tokens.forEach(function (t) {
    if (!t.used && t.index < pos && (best === null || t.index > best.index)) best = t;
  });
  return best;
}
function nearestAfter(tokens, pos) {
  let best = null;
  tokens.forEach(function (t) {
    if (!t.used && t.index >= pos && (best === null || t.index < best.index)) best = t;
  });
  return best;
}
function findTokenAt(tokens, pos) {
  let best = null, bestD = 1e9;
  tokens.forEach(function (t) {
    const d = Math.abs(t.index - pos);
    if (d < bestD) { bestD = d; best = t; }
  });
  return best;
}
function monthlyOf(value, text, tok) {
  const tail = text.slice(tok.index + tok.raw.length, tok.index + tok.raw.length + 24).toLowerCase();
  if (/\b(week|weekly)\b/.test(tail)) return Math.round(value * 4.33);
  return value;
}

function nextCategoryWord(text, pos) {
  /* does another category keyword appear right after this position?
     e.g. in "$1500 on rent, $800 on food", $800 belongs to food — exclude it
     from being matched to rent */
  const seg = text.slice(pos, pos + 14).toLowerCase();
  for (let i = 0; i < CAT_RULES.length; i++) {
    const words = CAT_RULES[i].words;
    for (let j = 0; j < words.length; j++) {
      if (seg.indexOf(words[j]) !== -1) return true;
    }
  }
  return false;
}

/* extract expenses: for each category keyword, grab the nearest unused amount
   (either "$X on <cat>" or "<cat> is $X") */
function parseExpenses(text, tokens) {
  const out = {};
  CAT_RULES.forEach(function (rule) {
    rule.words.forEach(function (w) {
      const re = new RegExp("\\b" + escapeRe(w) + "\\b", "i");
      const m = re.exec(text);
      if (!m) return;
      const wordEnd = m.index + m[0].length;
      const before = nearestBefore(tokens, m.index);
      const after = nearestAfter(tokens, wordEnd);
      const afterBlocked = after !== null && nextCategoryWord(text, after.index + after.raw.length);
      const dBefore = before !== null ? m.index - (before.index + before.raw.length) : 1e9;
      const dAfter = after !== null ? after.index - wordEnd : 1e9;
      let tok = null;
      if (!afterBlocked && dAfter <= 20 && dAfter < dBefore) tok = after;
      else if (dBefore <= 40) tok = before;
      if (tok !== null) {
        tok.used = true;
        out[rule.cat] = tok.value;
      }
    });
  });
  return out;
}

/* extract income: "I earn/make $5000 a month", "salary of 5000", "income is 5000" */
function parseIncome(text, tokens) {
  const re = new RegExp("\\b(?:" + INCOME_WORDS.map(escapeRe).join("|") + ")\\b[^0-9$]{0,25}?\\$?(\\d[\\d,]*(?:\\.\\d+)?)", "i");
  let m;
  while ((m = re.exec(text)) !== null) {
    const digitIdx = text.indexOf(m[1], m.index);
    const tok = findTokenAt(tokens, digitIdx);
    if (tok && !tok.used) { tok.used = true; return monthlyOf(tok.value, text, tok); }
    const pos = m.index + m[0].length;
    if (pos >= text.length) break;
    text = text.slice(pos);
    if (text.length < 4) break;
  }
  /* fallback: "I get paid 5000 / month" or "$5000 per month" with no income word */
  const re2 = /\$?\s*(\d[\d,]*(?:\.\d+)?)\s*(?:per month|a month|monthly|each month|per week|a week|weekly)\b/i;
  const m2 = re2.exec(text);
  if (m2) {
    const digitIdx = text.indexOf(m2[1], m2.index);
    const tok = findTokenAt(tokens, digitIdx);
    if (tok && !tok.used) { tok.used = true; return monthlyOf(tok.value, text, tok); }
  }
  return null;
}

/* classify what the user wants */
function classify(text) {
  const t = text.toLowerCase().trim();
  if (/^(hi|hello|hey|yo|good (morning|afternoon|evening))[\s,.!?]?/.test(t) && t.length < 30) return "greeting";
  if (/\b(thank|thanks|thx|appreciate)\b/.test(t)) return "thanks";
  if (/\b(reset|clear|start over|restart|forget)\b/.test(t)) return "reset";
  if (/\b(help|what can you do|how (do|does) (i use|this work|you work)|how does this agent work)\b/.test(t)) return "help";
  if (/(how much (should|can|do) i (save|put away)|(am|are) i saving enough|should i save|(am|are) my savings)/.test(t)) return "savings";
  if (/what('s| is) the (rule|limit|threshold) for/.test(t)) return "rule";
  if (/(how much (should|can|do) i (spend|budget|allocate|put) on|what should my .*(budget|limit|be)|what('s| is) (a |the )?healthy .* (budget|limit))/.test(t)) return "allowance";
  if (/(too (much|high|low)|over (budget|spending|the limit)|over by|am i (ok|okay|fine|good|healthy|overspending|in trouble)|is that (a lot|too much)|can i afford)/.test(t)) return "check";
  if (/\b(what|how)('s| is| does| do| are)\b/.test(t) && /(rule|threshold|limit|works|work|50[-/ ]?30[-/ ]?20|50\/30\/20)/.test(t)) return "rule";
  if (/(what('s| is) (my )?(verdict|status|result|analysis)|analyze (me|my budget|my spending)|run (the )?analysis|review (me|my budget|my spending)|give me (the )?(verdict|analysis))/i.test(t)) return "status";
  if (t.length < 4) return "unknown";
  return "data";
}

/* =====================================================================
   Part 3: conversation state + reply builder
   ===================================================================== */
const state = { income: null, expenses: {} };

function renderVerdictCard(r) {
  const meta = BRANCH_META[r.branch];
  let flagsHtml;
  if (r.flags.length === 0) {
    flagsHtml = '<div class="no-flags">✓ No category exceeds its healthy threshold.</div>';
  } else {
    flagsHtml = r.flags.map(function (f) {
      return '<div class="flag-item"><span><strong>' + f.category + '</strong> · ' +
        money(f.amount) + ' spent, limit ' + money(f.threshold) + '</span>' +
        '<span class="badge">over by ' + money(f.over_by) + '</span></div>';
    }).join("");
  }
  const adviceHtml = '<ol class="advice">' + r.advice.map(function (t) {
    return "<li>" + t + "</li>";
  }).join("") + "</ol>";
  const rateCls = r.rate < 0 ? "red" : (r.rate >= 0.10 ? "green" : "");
  return '<div class="bubble card">' +
    '<div class="verdict ' + r.branch + '">' +
      '<div class="v-label">' + meta.label + '</div>' +
      '<div class="v-text">' + meta.text + '</div>' +
    '</div>' +
    '<div class="stats">' +
      '<div class="stat"><div class="s-label">Income</div><div class="s-val">' + money(r.income) + '</div></div>' +
      '<div class="stat"><div class="s-label">Total expenses</div><div class="s-val">' + money(r.total) + '</div></div>' +
      '<div class="stat"><div class="s-label">Savings</div><div class="s-val ' + rateCls + '">' + money(r.savings) + '</div></div>' +
      '<div class="stat"><div class="s-label">Savings rate</div><div class="s-val ' + rateCls + '">' + pct(r.rate) + '</div></div>' +
    '</div>' +
    '<div class="section-title">Flagged categories</div>' + flagsHtml +
    '<div class="section-title">Coach\u2019s advice</div>' + adviceHtml +
    '<div class="agent-foot">Want me to drill into any category? Just ask, e.g. “Is $400 on utilities too much?”</div>' +
    '</div>';
}

function healthyBudgetTable(income) {
  let rows = "";
  Object.keys(THRESHOLDS).forEach(function (cat) {
    rows += "<tr><td>" + cat + "</td><td>" + pct(THRESHOLDS[cat]) + " → " + money(THRESHOLDS[cat] * income) + "</td></tr>";
  });
  return '<table class="budget-table">' + rows +
    '<tr><td><strong>Savings target</strong></td><td><strong>≥ ' + pct(SAVINGS_TARGET) + ' → ' + money(SAVINGS_TARGET * income) + '</strong></td></tr>' +
    "</table>";
}

function catFromPhrase(text, fallback) {
  const re = /\bon\s+([a-z &-]+?)[?.!\s]*$/i;
  const m = re.exec(text);
  if (m) {
    const phrase = m[1].toLowerCase().trim();
    for (let i = 0; i < CAT_RULES.length; i++) {
      const r = CAT_RULES[i];
      for (let j = 0; j < r.words.length; j++) {
        if (phrase.indexOf(r.words[j]) !== -1) return r.cat;
      }
    }
  }
  return fallback || null;
}

/* ---------- reply handlers ---------- */

function replyGreeting() {
  return "<p>Hi! I\u2019m your budget coach.</p><p>Tell me your income and expenses in a sentence and I\u2019ll analyze your budget like a coach would — flag overspending, check your savings rate, and give you specific numbers to act on.</p><p>Try: <i>“I earn $5000 a month and spend $1500 on rent, $800 on food.”</i> — or ask me anything, like <i>“Is $800 on food too much?”</i></p>";
}
function replyThanks() { return "<p>Anytime! Tell me more about your budget whenever you\u2019re ready.</p>"; }
function replyReset() {
  state.income = null;
  state.expenses = {};
  return "<p>Reset done — I\u2019ve cleared everything I knew about your budget. Start fresh whenever you like.</p>";
}
function replyHelp() {
  return "<p>Here\u2019s what I can do (all rule-based, no external APIs):</p><ol>" +
    "<li><b>Full analysis</b> — tell me your income and expenses in one sentence: <i>“I earn $5000 a month and spend $1500 on rent, $800 on food.”</i></li>" +
    "<li><b>Spot-check a category</b> — <i>“Is $800 on food too much?”</i> (I\u2019ll compare it to the healthy limit for your income).</li>" +
    "<li><b>Ask for a budget</b> — <i>“How much should I spend on rent?”</i></li>" +
    "<li><b>Check savings</b> — <i>“Am I saving enough?”</i></li>" +
    "<li><b>Ask about the rules</b> — <i>“What\u2019s the threshold for housing?”</i> or <i>“How does this work?”</i></li></ol>" +
    "<p>I remember what you tell me, so you can build up your budget across several messages. Say “reset” to start over.</p>";
}
function replyRule(parsed) {
  const cat = parsed.category || catFromPhrase(parsed.text, null);
  if (cat && THRESHOLDS[cat] !== undefined) {
    let s = "<p>The healthy limit for <b>" + cat + "</b> is <b>" + pct(THRESHOLDS[cat]) + " of income</b>.";
    if (state.income !== null) {
      s += " With your income of " + money(state.income) + ", that means up to <b>" + money(THRESHOLDS[cat] * state.income) + "/month</b>.";
    } else {
      s += " Tell me your income and I\u2019ll turn that into a dollar number for you.";
    }
    return s + "</p>";
  }
  return "<p>I work with three simple rules:</p><ol>" +
    "<li><b>Flag rule</b> — every category has a healthy limit as a % of income (Housing 30%, Debt 20%, Food &amp; Transport 15%, the rest 10%). Anything above its limit gets flagged with the exact over-by amount.</li>" +
    "<li><b>Savings rate</b> — (income − total expenses) ÷ income.</li>" +
    "<li><b>Branch</b> — below 0% → emergency; 0–10% → aggressive cuts; ≥10% → optimization tips.</li></ol>" +
    "<p>All thresholds are listed in the “Health thresholds” section below this chat. No external APIs — same answer every time.</p>";
}
function replyStatus() {
  if (state.income !== null && Object.keys(state.expenses).length > 0) {
    return renderVerdictCard(analyze(state.income, state.expenses));
  }
  return "<p>I don\u2019t have enough yet — tell me your income and some expenses, and I\u2019ll run the full analysis.</p>";
}
function replyAllowance(parsed) {
  const cat = parsed.category || catFromPhrase(parsed.text, null);
  if (state.income === null) {
    let s = "<p>I\u2019d need your monthly income to give you a dollar number.</p>";
    if (cat) s += "<p>Quick rule of thumb: keep <b>" + cat + "</b> at or under <b>" + pct(THRESHOLDS[cat] || 0.10) + " of income</b>.</p>";
    s += "<p>Tell me, e.g. <i>“I earn $5000 a month”</i>, and I\u2019ll compute your budget.</p>";
    return s;
  }
  if (cat && THRESHOLDS[cat] !== undefined) {
    const limit = THRESHOLDS[cat] * state.income;
    return "<p>With " + money(state.income) + "/month income, a healthy <b>" + cat + "</b> budget is <b>" +
      money(limit) + "</b> (" + pct(THRESHOLDS[cat]) + " of income)." +
      (state.expenses[cat] !== undefined
        ? " You currently spend " + money(state.expenses[cat]) + " — " +
          (state.expenses[cat] > limit ? "that\u2019s " + money(state.expenses[cat] - limit) + " over." : "well within the limit.") +
          (state.expenses[cat] > limit ? " Trim it to " + money(limit) + " and you free " + money(state.expenses[cat] - limit) + "/month." : "")
        : " Tell me what you actually spend and I\u2019ll check it against this.") + "</p>";
  }
  return "<p>Here\u2019s a healthy monthly budget for " + money(state.income) + " income:</p>" +
    healthyBudgetTable(state.income) +
    "<p class='agent-foot'>These are the rule-based limits I check your spending against.</p>";
}
function replyCheck(parsed) {
  const expCount = Object.keys(parsed.expenses).length;
  if (parsed.income !== null) state.income = parsed.income;
  Object.keys(parsed.expenses).forEach(function (cat) { state.expenses[cat] = parsed.expenses[cat]; });

  /* full sentence with real data (income or 2+ categories) -> full analysis */
  if (parsed.income !== null || expCount >= 2) {
    if (state.income !== null && Object.keys(state.expenses).length > 0) {
      return renderVerdictCard(analyze(state.income, state.expenses));
    }
  }

  /* single-category question: "Is $800 on food too much?" */
  if (expCount === 1) {
    const cat = Object.keys(parsed.expenses)[0];
    const amount = parsed.expenses[cat];
    if (state.income === null) {
      let s = "<p>I\u2019d need your monthly income to judge that.</p>";
      s += "<p>For reference, " + cat + " should stay at or under " + pct(THRESHOLDS[cat] || 0.10) + " of income.</p>";
      s += "<p>Tell me e.g. <i>“I earn $5000 a month and spend " + money(amount) + " on " + cat.toLowerCase() + ".”</i> and I\u2019ll compare right away.</p>";
      return s;
    }
    const limit = (THRESHOLDS[cat] || 0.10) * state.income;
    const diff = amount - limit;
    const over = diff > 0;
    return "<p>With " + money(state.income) + "/month income, the healthy limit for <b>" + cat +
      "</b> is <b>" + money(limit) + "</b> (" + pct(THRESHOLDS[cat] || 0.10) + " of income).</p>" +
      "<p>You\u2019re spending <b>" + money(amount) + "</b> — that\u2019s " +
      (over ? "<b>" + money(diff) + " over</b> the limit. Cut it to " + money(limit) + " and you free " + money(diff) + "/month."
             : "<b>" + money(-diff) + " under</b> the limit — no problem.") + "</p>";
  }

  /* general overspending question with remembered budget */
  if (state.income !== null && Object.keys(state.expenses).length > 0) {
    return renderVerdictCard(analyze(state.income, state.expenses));
  }
  return "<p>Tell me what you\u2019re spending — e.g. <i>“I spend $1500 on housing, $800 on food.”</i> — and I\u2019ll check every category against its limit.</p>";
}
function replySavings(parsed) {
  if (state.income === null) {
    return "<p>To check savings I need your income and expenses. Tell me e.g. <i>“I earn $5000 a month and spend $4000 total.”</i></p>";
  }
  if (Object.keys(state.expenses).length === 0) {
    return "<p>I know your income is " + money(state.income) + " — now tell me your monthly expenses and I\u2019ll compute your savings rate vs. the 10% target.</p>";
  }
  const r = analyze(state.income, state.expenses);
  const need = state.income * SAVINGS_TARGET - r.savings;
  if (r.rate < 0) {
    return "<p>Right now you\u2019re spending <b>" + money(-r.savings) + " more than you earn</b> (savings rate " + pct(r.rate) + "). No savings — you\u2019re in emergency territory. Cut spending until the rate is back above 0%.</p>";
  }
  if (r.rate < SAVINGS_TARGET) {
    return "<p>Your savings rate is <b>" + pct(r.rate) + "</b> — below the 10% health line. You\u2019re saving " + money(r.savings) +
      "/month; to hit 10% you need to free up about <b>" + money(need) + "/month</b>.</p>" +
      "<p>Details and the exact cuts are in my full analysis — just ask “review my budget”.</p>";
  }
  return "<p>Yes — you\u2019re saving <b>" + pct(r.rate) + "</b> of income (" + money(r.savings) + "/month), above the 10% health line.</p>" +
    "<p>Nice work. Next step: automate that transfer on payday and consider investing the surplus.</p>";
}

function replyData(parsed) {
  if (parsed.income !== null) state.income = parsed.income;
  Object.keys(parsed.expenses).forEach(function (cat) {
    state.expenses[cat] = parsed.expenses[cat];
  });

  if (state.income !== null && Object.keys(state.expenses).length > 0) {
    const usedCats = Object.keys(state.expenses).length;
    const lead = usedCats < 4
      ? "<p>I only counted the " + usedCats + " categories you mentioned — tell me the rest (or say “review my budget” after adding them) for a fuller picture.</p>"
      : "<p>Got it — here\u2019s your full check-up:</p>";
    return lead + renderVerdictCard(analyze(state.income, state.expenses));
  }
  if (state.income !== null) {
    return "<p>Got it — income <b>" + money(state.income) + "/month</b>.</p>" +
      "<p>Here\u2019s what a healthy monthly budget looks like at that income:</p>" +
      healthyBudgetTable(state.income) +
      "<p class='agent-foot'>Now tell me what you actually spend, e.g. <i>“I spend $1500 on housing, $800 on food.”</i> — I\u2019ll check you against these limits.</p>";
  }
  if (gotExp) {
    const list = Object.keys(parsed.expenses).map(function (c) {
      return c + " " + money(parsed.expenses[c]);
    }).join(", ");
    return "<p>Noted — you spend " + list + ".</p>" +
      "<p>To judge that fairly I need your monthly income too. Tell me e.g. <i>“I earn $5000 a month.”</i></p>";
  }
  return "<p>I couldn\u2019t find income or expense numbers in that. Try something like <i>“I earn $5000 a month and spend $1500 on rent, $800 on food.”</i> — or ask <i>“How much should I spend on rent?”</i></p>";
}

/* ---------- entry point ---------- */

function parseMessage(text) {
  const tokens = tokenizeAmounts(text);
  const parsed = {
    text: text,
    intent: classify(text),
    income: null,
    expenses: {},
    category: null,
    amount: null
  };
  /* category + amount for check/allowance questions ("is $800 on food too much?") */
  const reCat = new RegExp("\\b(" + CAT_RULES.map(function (r) { return r.words.map(escapeRe).join("|"); }).join("|") + ")\\b", "i");
  const mCat = reCat.exec(text);
  if (mCat) {
    for (let i = 0; i < CAT_RULES.length; i++) {
      const r = CAT_RULES[i];
      for (let j = 0; j < r.words.length; j++) {
        if (mCat[1].toLowerCase() === r.words[j]) parsed.category = r.cat;
      }
    }
    const amtRe = /\$?\s*(\d[\d,]*(?:\.\d+)?)/;
    const seg = text.slice(Math.max(0, mCat.index - 45), mCat.index + mCat[0].length + 20);
    const mA = amtRe.exec(seg);
    if (mA) {
      const tok = findTokenAt(tokens, mCat.index);
      if (tok) parsed.amount = tok.value;
      else parsed.amount = parseFloat(mA[1].replace(/,/g, ""));
    }
  }
  if (parsed.intent === "data" || parsed.intent === "check") {
    parsed.expenses = parseExpenses(text, tokens);
    parsed.income = parseIncome(text, tokens);
  }
  return parsed;
}

function handleMessage(text) {
  const parsed = parseMessage(text);
  switch (parsed.intent) {
    case "greeting": return replyGreeting();
    case "thanks":   return replyThanks();
    case "reset":    return replyReset();
    case "help":     return replyHelp();
    case "rule":     return replyRule(parsed);
    case "status":   return replyStatus();
    case "allowance":return replyAllowance(parsed);
    case "check":    return replyCheck(parsed);
    case "savings":  return replySavings(parsed);
    case "unknown":  return "<p>Hmm, that was too short for me to work with. Try a full sentence like <i>“I earn $5000 a month and spend $1500 on rent.”</i></p>";
    default:         return replyData(parsed);
  }
}

/* ---------- DOM ---------- */
function el(id) { return document.getElementById(id); }

function addMsg(kind, html) {
  const chat = el("chat");
  const div = document.createElement("div");
  div.className = "msg " + kind;
  div.innerHTML = html + '<div class="who">' + (kind === "user" ? "You" : "Coach") + "</div>";
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function updateCtxBar() {
  let html = "";
  if (state.income !== null) {
    html += '<span>Income: <b>' + money(state.income) + '/mo</b></span>';
  } else {
    html += "<span>Income: <i>unknown</i></span>";
  }
  const n = Object.keys(state.expenses).length;
  html += '<span>Expense categories known: <span class="chip-ctx">' + n + "</span></span>";
  if (n > 0) {
    html += "<span>" + Object.keys(state.expenses).map(function (c) { return c; }).join(" · ") + "</span>";
  }
  html += '<span style="margin-left:auto;color:#9ca3af">Say “reset” to start over</span>';
  el("ctxbar").innerHTML = html;
}

function sendMessage() {
  const input = el("msgInput");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  addMsg("user", '<div class="bubble">' + escapeHtml(text) + "</div>");
  const reply = handleMessage(text);
  addMsg("agent", reply);
  updateCtxBar();
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

/* example chips — click to send */
const EXAMPLE_PROMPTS = [
  "I earn $4000 a month and spend $1500 on housing, $800 on food, $600 on debt. Am I okay?",
  "I make $5000 a month; rent is $1800, food is $800. What do you think?",
  "My income is $6000: housing $1500, food $750, transport $350, debt $400. Am I saving enough?",
  "How much should I spend on rent?",
  "Is $800 on food too much?",
  "Am I saving enough?",
  "What's the threshold for housing?",
  "How does this agent work?"
];
const chipsBox = el("chips");
EXAMPLE_PROMPTS.forEach(function (p) {
  const b = document.createElement("button");
  b.className = "chip";
  b.textContent = p.length > 46 ? p.slice(0, 46) + "…" : p;
  b.title = p;
  b.onclick = function () {
    el("msgInput").value = p;
    sendMessage();
  };
  chipsBox.appendChild(b);
});

/* rules table */
el("rulesTbl").innerHTML = Object.keys(THRESHOLDS).map(function (k) {
  return "<tr><td>" + k + "</td><td>" + Math.round(THRESHOLDS[k] * 100) + "% of income</td></tr>";
}).join("") + "<tr><td>Savings target</td><td>≥ 10% of income</td></tr>" +
  "<tr><td colspan=2 style='color:#6b7280;font-weight:400'>Custom categories use the 10% default limit.</td></tr>";

/* Enter to send */
el("msgInput").addEventListener("keydown", function (e) {
  if (e.key === "Enter") { e.preventDefault(); sendMessage(); }
});

/* welcome message */
addMsg("agent", replyGreeting());
updateCtxBar();
</script>
